  - id: "W02-P03"
    title: "Centralized API Client package (packages/api-client)"
    file: "phases/W02/P03.yaml"
    depends_on: ["W02-P01"]
    scope: "Extract ApiClient HTTP wrapper, error unwrapping, and endpoint dictionaries"
    status: "completed"

