  - id: "W04-P09"
    title: "Taxation frontend domain"
    file: "phases/W04/P09.yaml"
    depends_on: ["W04-P01", "W05-P01", "W05-P02"]
    scope: "Migrate src/features/gst-returns and income-tax into taxation domain"
    status: "completed"

  - id: "W04-P10"
    title: "Reporting frontend domain"
    file: "phases/W04/P10.yaml"
    depends_on: ["W04-P05", "W04-P07"]
    scope: "Migrate src/features/reports and ReportsPage into reporting domain"
    status: "completed"

  - id: "W04-P11"
    title: "Documents & Document Renderer package"
    file: "phases/W04/P11.yaml"
    depends_on: ["W04-P05"]
    scope: "Extract packages/document-renderer and migrate templates into documents domain"
    status: "completed"

  - id: "W04-P12"
    title: "Integrations, Data Management & Help frontend domains"
    file: "phases/W04/P12.yaml"
    depends_on: ["W04-P01"]
    scope: "Migrate SupabasePage, ControlPanelPage, and UserGuidePage into integrations, data-management, and help"
    status: "completed"

