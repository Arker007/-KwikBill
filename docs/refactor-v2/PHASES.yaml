  - id: "W05-P01"
    title: "Statutory GST calculation package extraction (packages/financial-core)"
    file: "phases/W05/P01.yaml"
    depends_on: ["W00-P01", "W02-P01"]
    scope: "Quarantine pure statutory GST tax, discount, rounding, and gstin validation logic"
    status: "completed"

  - id: "W05-P02"
    title: "Statutory Income Tax calculation package extraction"
    file: "phases/W05/P02.yaml"
    depends_on: ["W05-P01"]
    scope: "Quarantine Budget 2025 income tax, 87A rebate, capital gains, presumptive, and 234 interest algorithms"
    status: "completed"

  - id: "W05-P03"
    title: "Package integration with backend and frontend invoicing engines"
    file: "phases/W05/P03.yaml"
    depends_on: ["W05-P01", "W03-P05", "W04-P05"]
    scope: "Wire packages/financial-core as authoritative calculation source for frontend and backend"
    status: "completed"

  # W06: Persistence and SQLite migration
  - id: "W06-P01"
    title: "Database migration scripts and schema layout (database/)"
    file: "phases/W06/P01.yaml"
    depends_on: ["W00-P01"]
    scope: "Establish database/schema, database/migrations, and database/seeds"
    status: "completed"

  - id: "W06-P02"
    title: "Backend persistence engine relocation to apps/api/src/infrastructure/persistence"
    file: "phases/W06/P02.yaml"
    depends_on: ["W03-P01", "W06-P01"]
    scope: "Relocate SqliteCollectionRepository, JsonCollectionRepository, and sqlite.js adapter"
    status: "completed"

  - id: "W06-P03"
    title: "SingleFileRepository & Meta counters reconciliation (Dual-write & SQLite parity)"
    file: "phases/W06/P03.yaml"
    depends_on: ["W06-P02"]
    scope: "Bridge meta counters and app settings to write to SQLite app_settings and meta_counters tables"
    status: "completed"

  - id: "W06-P04"
    title: "SQLite source-of-truth cutover & fallback switch verification"
    file: "phases/W06/P04.yaml"
    depends_on: ["W06-P03"]
    scope: "Verify 100% parity across bills, clients, and meta; configure primary read/write routing to accounting.db"
    status: "completed"

  # W07: Background jobs and integrations
  - id: "W07-P01"
    title: "Scheduler infrastructure relocation (apps/api/src/infrastructure/scheduler)"
    file: "phases/W07/P01.yaml"
    depends_on: ["W03-P06"]
    scope: "Relocate recurring billing engine and trash cleanup cron scheduler"
    status: "completed"

  - id: "W07-P02"
    title: "Backup and snapshot infrastructure (apps/api/src/infrastructure/backups)"
    file: "phases/W07/P02.yaml"
    depends_on: ["W03-P01", "W06-P02"]
    scope: "Relocate rolling backup engine and pre-sync snapshot generator"
    status: "completed"

  - id: "W07-P03"
    title: "Supabase cloud sync infrastructure (apps/api/src/infrastructure/cloud-sync)"
    file: "phases/W07/P03.yaml"
    depends_on: ["W03-P01"]
    scope: "Relocate Supabase transformers, sync service, and connection ping handler"
    status: "completed"

  # W08: Testing, security and quality gates
  - id: "W08-P01"
    title: "Test harness consolidation into tests/{contract,security,migration,e2e}"
    file: "phases/W08/P01.yaml"
    depends_on: ["W03-P10", "W04-P12"]
    scope: "Consolidate and normalize smoke tests, contract tests, security tests, and parity scripts"
    status: "completed"

  - id: "W08-P02"
    title: "Security gate verification: Path traversal & input sanitization"
    file: "phases/W08/P02.yaml"
    depends_on: ["W08-P01"]
    scope: "Verify 100% path traversal rejection across all document ID parameters and file APIs"
    status: "completed"

  - id: "W08-P03"
    title: "Comprehensive financial and discount parity regression audit"
    file: "phases/W08/P03.yaml"
    depends_on: ["W05-P03", "W06-P04", "W08-P01"]
    scope: "Run full 70/70 tax test, 9/9 discount modes, and multi-currency edge case tests"
    status: "completed"

  # W09: Legacy cleanup and final verification
  - id: "W09-P01"
    title: "Legacy facade entry points decommissioning"
    file: "phases/W09/P01.yaml"
    depends_on: ["W08-P03"]
    scope: "Decommission root facades in server.js and src/App.jsx once all imports resolve to monorepo targets"
    status: "completed"

  - id: "W09-P02"
    title: "Legacy data directory archiving to data/legacy-json"
    file: "phases/W09/P02.yaml"
    depends_on: ["W09-P01", "W06-P04"]
    scope: "Archive legacy data/ flat JSON files into data/legacy-json/ while retaining SQLite accounting.db primary"
    status: "completed"

  - id: "W09-P03"
    title: "Monorepo production build, parity verification, and documentation update"
    file: "phases/W09/P03.yaml"
    depends_on: ["W09-P02"]
    scope: "Final compile_applet, verify smoke suite, update README, and freeze refactor state"
    status: "completed"
