version: "2.0.0"
phases:
  # W00: Baseline audit and safety checks
  - id: "W00-P01"
    title: "Baseline verification, test suite freeze, and data snapshot manifest"
    file: "phases/W00/P01.yaml"
    depends_on: []
    scope: "Verification of 70/70 tax tests, 9/9 discount tests, smoke suite, and creating pre-refactor backup snapshot"
    status: "completed"

  # W01: Workspace and build infrastructure
  - id: "W01-P01"
    title: "Monorepo workspace configuration & base TypeScript setup"
    file: "phases/W01/P01.yaml"
    depends_on: ["W00-P01"]
    scope: "Declare workspaces in package.json (apps/*, packages/*) and tsconfig.base.json"
    status: "completed"

  - id: "W01-P02"
    title: "Shared build and packaging presets (packages/config)"
    file: "phases/W01/P02.yaml"
    depends_on: ["W01-P01"]
    scope: "Establish shared compiler, linting, and Tailwind configurations in packages/config"
    status: "completed"

  - id: "W01-P03"
    title: "App routing and proxy setup for web/api development server"
    file: "phases/W01/P03.yaml"
    depends_on: ["W01-P02"]
    scope: "Configure apps/web Vite configuration and Express 0.0.0.0:3000 reverse proxy bridge"
    status: "completed"

  # W02: Shared contracts and reusable utilities
  - id: "W02-P01"
    title: "Common API Contracts package (packages/api-contracts)"
    file: "phases/W02/P01.yaml"
    depends_on: ["W01-P01"]
    scope: "Consolidate DTOs, endpoint routes, query/body schemas, and shared TypeScript models"
    status: "completed"

  - id: "W02-P02"
    title: "Shared UI component library foundation (packages/ui)"
    file: "phases/W02/P02.yaml"
    depends_on: ["W01-P02"]
    scope: "Migrate shared UI primitives, feedback modals, and design tokens to packages/ui"
