  - id: "W03-P01"
    title: "Backend app bootstrap and middleware infrastructure"
    file: "phases/W03/P01.yaml"
    depends_on: ["W01-P03", "W02-P01"]
    scope: "Establish apps/api/src/bootstrap and apps/api/src/platform/middleware"
    status: "completed"

  - id: "W03-P02"
    title: "Organization & Identity backend modules"
    file: "phases/W03/P02.yaml"
    depends_on: ["W03-P01"]
    scope: "Migrate server/modules/profiles into apps/api/src/modules/organization and identity"
    status: "completed"

  - id: "W03-P03"
    title: "Customer Management backend module"
    file: "phases/W03/P03.yaml"
    depends_on: ["W03-P01"]
    scope: "Migrate server/modules/clients into apps/api/src/modules/customers"
    status: "completed"

  - id: "W03-P04"
    title: "Catalog & Inventory backend modules"
    file: "phases/W03/P04.yaml"
    depends_on: ["W03-P01"]
    scope: "Migrate server/modules/products into apps/api/src/modules/catalog and inventory"
    status: "completed"

  - id: "W03-P05"
    title: "Invoicing & Counters backend module"
    file: "phases/W03/P05.yaml"
    depends_on: ["W03-P03", "W03-P04"]
    scope: "Migrate server/modules/bills and meta numbering into apps/api/src/modules/invoicing"
    status: "completed"

  - id: "W03-P06"
    title: "Recurring Billing backend module"
    file: "phases/W03/P06.yaml"
    depends_on: ["W03-P05"]
    scope: "Migrate server/modules/recurring into apps/api/src/modules/recurring-billing"
    status: "completed"

  - id: "W03-P07"
    title: "Purchasing & Expenses backend modules"
    file: "phases/W03/P07.yaml"
    depends_on: ["W03-P01"]
    scope: "Migrate server/modules/purchases and expenses into apps/api/src/modules/purchasing and expenses"
    status: "completed"

  - id: "W03-P08"
    title: "Payments & Allocations backend module"
    file: "phases/W03/P08.yaml"
    depends_on: ["W03-P05"]
    scope: "Migrate server/modules/receipts into apps/api/src/modules/payments"
    status: "completed"

  - id: "W03-P09"
    title: "Taxation & Reporting backend modules"
    file: "phases/W03/P09.yaml"
    depends_on: ["W03-P05", "W03-P07"]
    scope: "Create tax summary endpoints and financial reporting aggregation services"
    status: "completed"

  - id: "W03-P10"
    title: "Documents & Templates backend module"
    file: "phases/W03/P10.yaml"
    depends_on: ["W03-P01"]
    scope: "Migrate server/modules/templates into apps/api/src/modules/documents"
    status: "completed"

  # W04: Frontend domain separation
  - id: "W04-P01"
