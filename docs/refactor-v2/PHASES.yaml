  - id: "W04-P02"
    title: "Identity & Organization frontend domains"
    file: "phases/W04/P02.yaml"
    depends_on: ["W04-P01", "W02-P03"]
    scope: "Decompose SettingsPage into identity and organization domains"
    status: "completed"

  - id: "W04-P03"
    title: "Customers frontend domain"
    file: "phases/W04/P03.yaml"
    depends_on: ["W04-P01", "W02-P03"]
    scope: "Migrate src/features/clients and ClientsPage into apps/web/src/domains/customers"
    status: "completed"

  - id: "W04-P04"
    title: "Catalog & Inventory frontend domains"
    file: "phases/W04/P04.yaml"
    depends_on: ["W04-P01", "W02-P03"]
    scope: "Migrate src/features/inventory into apps/web/src/domains/catalog and inventory"
    status: "completed"

  - id: "W04-P05"
    title: "Invoicing frontend domain"
    file: "phases/W04/P05.yaml"
    depends_on: ["W04-P03", "W04-P04"]
    scope: "Migrate src/features/invoices, InvoiceEditorPage, and DashboardPage into invoicing domain"
    status: "completed"

  - id: "W04-P06"
    title: "Recurring Billing frontend domain"
    file: "phases/W04/P06.yaml"
    depends_on: ["W04-P05"]
    scope: "Migrate src/features/recurring and RecurringPage into recurring-billing domain"
    status: "completed"

  - id: "W04-P07"
    title: "Purchasing & Expenses frontend domains"
    file: "phases/W04/P07.yaml"
    depends_on: ["W04-P01", "W02-P03"]
    scope: "Migrate src/features/purchases and expenses into purchasing and expenses domains"
    status: "completed"

  - id: "W04-P08"
    title: "Payments frontend domain"
    file: "phases/W04/P08.yaml"
    depends_on: ["W04-P05"]
    scope: "Migrate src/features/receipts and ReceiptsPage into payments domain"
