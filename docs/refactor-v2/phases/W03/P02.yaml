id: "W03-P02"
title: "Organization & Identity backend modules"
status: "completed"
depends_on:
  - "W03-P01"
objective: "Migrate business profiles and identity management into apps/api/src/modules/organization and identity."
scope: "Backend profiles controller, service, and repository porting with multi-profile and primary profile routing."
files_read:
  - "server/modules/profiles/profiles.controller.js"
  - "server/modules/profiles/profiles.service.js"
  - "server/modules/profiles/profiles.repository.js"
  - "server/modules/profiles/profiles.routes.js"
files_create:
